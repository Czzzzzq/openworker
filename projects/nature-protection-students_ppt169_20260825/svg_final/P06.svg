<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><circle cx="1080" cy="360" r="190" fill="#E9F5E7"/><circle cx="1080" cy="360" r="110" fill="#FADACF"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">05 / 从餐桌开始</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">每天被浪费的，不只是食物</text><text x="72" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">全球家庭每天浪费的餐食，足以让“按需选择”成为重要行动。</text><text x="86" y="390" font-family="Arial, sans-serif" font-size="116" font-weight="700" fill="#F47C5A">10亿+</text><text x="92" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#195B45">份餐食 / 每天</text><text x="95" y="505" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#567066">2022 年，全球家庭</text><path d="M1015 250 C965 310 965 405 1080 465 C1195 405 1195 310 1080 250Z" fill="#2D9CDB" opacity="0.9"/><circle cx="1080" cy="360" r="46" fill="#FFF8EA"/><path d="M1048 360 h64 M1080 328 v64" stroke="#195B45" stroke-width="8" stroke-linecap="round"/><text x="1080" y="590" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#195B45">少一点浪费，多一点被看见的价值</text><text x="72" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#567066">来源：UNEP Food Waste Index 2024。事实编号：F003。</text></svg>
