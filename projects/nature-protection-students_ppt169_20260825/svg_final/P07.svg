<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">06 / 把数据变成习惯</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">从“吃多少”到“点多少”</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">减废不靠完美，而靠下一次更准确的选择。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><g><circle cx="150" cy="340" r="35" fill="#195B45"/><text x="150" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF8EA">1</text><text x="215" y="333" font-size="27" font-weight="700" fill="#195B45">先估量，再取餐</text><text x="215" y="372" font-size="19" fill="#567066">给自己留一点“刚刚好”</text></g><g><circle cx="150" cy="445" r="35" fill="#2D9CDB"/><text x="150" y="455" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF8EA">2</text><text x="215" y="438" font-size="27" font-weight="700" fill="#195B45">小份优先</text><text x="215" y="477" font-size="19" fill="#567066">不够再加，比剩下更轻松</text></g><g><circle cx="650" cy="340" r="35" fill="#F0B429"/><text x="650" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF8EA">3</text><text x="715" y="333" font-size="27" font-weight="700" fill="#195B45">剩余就打包</text><text x="715" y="372" font-size="19" fill="#567066">让食物多一次机会</text></g><g><circle cx="650" cy="445" r="35" fill="#F47C5A"/><text x="650" y="455" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF8EA">4</text><text x="715" y="438" font-size="27" font-weight="700" fill="#195B45">不随意多拿</text><text x="715" y="477" font-size="19" fill="#567066">把“顺手”换成“需要”</text></g><g><circle cx="1050" cy="340" r="35" fill="#195B45"/><text x="1050" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF8EA">5</text><text x="1110" y="333" font-size="27" font-weight="700" fill="#195B45">把建议反馈给食堂</text><text x="1110" y="372" font-size="19" fill="#567066">让系统也更好用</text></g></g><rect x="410" y="570" width="460" height="64" rx="32" fill="#E9F5E7"/><text x="640" y="610" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#195B45">减少浪费，从“点多少”开始</text></svg>
