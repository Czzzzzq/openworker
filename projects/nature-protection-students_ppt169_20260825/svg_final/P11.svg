<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">10 / 让好选择更容易发生</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">把个人选择，变成校园规则</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">个人动作 × 集体机制，才能把一次活动变成长期习惯。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="70" y="255" width="1140" height="58" rx="18" fill="#195B45"/><text x="235" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFF8EA">个人选择</text><text x="730" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFF8EA">班级 / 社团机制</text><text x="1100" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFF8EA">下一步</text><g fill="#E9F5E7"><rect x="70" y="330" width="1140" height="66" rx="14"/><rect x="70" y="410" width="1140" height="66" rx="14"/><rect x="70" y="490" width="1140" height="66" rx="14"/><rect x="70" y="570" width="1140" height="66" rx="14"/></g><g fill="#20352D" font-size="18"><text x="110" y="371">自带杯 / 餐具</text><text x="520" y="371">活动默认不提供一次性杯</text><text x="1040" y="371" fill="#F47C5A" font-weight="700">改默认</text><text x="110" y="451">正确分类</text><text x="520" y="451">设置清晰、好找的回收点</text><text x="1040" y="451" fill="#F47C5A" font-weight="700">改环境</text><text x="110" y="531">修复 / 再利用</text><text x="520" y="531">组织交换日、维修日</text><text x="1040" y="531" fill="#F47C5A" font-weight="700">改节奏</text><text x="110" y="611">发起倡议</text><text x="520" y="611">每周公开记录与复盘</text><text x="1040" y="611" fill="#F47C5A" font-weight="700">改习惯</text></g></g><text x="70" y="680" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#567066">矩阵内容为校园行动建议，不代表外部统计。</text></svg>
