<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">03 / 用数据看见规模</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">塑料问题有多大？</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">生产很大，泄漏也不可忽视——水生态系统正在承受压力。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="100" y="300" font-size="19" fill="#567066">全球塑料生产 / 年</text><rect x="100" y="330" width="790" height="72" rx="18" fill="#195B45"/><text x="925" y="378" font-size="38" font-weight="700" fill="#195B45">4亿+ 吨</text><text x="100" y="470" font-size="19" fill="#567066">泄漏进入水生生态系统 / 年</text><rect x="100" y="500" width="46" height="72" rx="18" fill="#F47C5A"/><text x="180" y="548" font-size="38" font-weight="700" fill="#F47C5A">1900–2300 万吨</text><rect x="980" y="245" width="210" height="310" rx="28" fill="#E9F5E7"/><circle cx="1085" cy="340" r="58" fill="#DDF0FA"/><path d="M1085 295 C1055 340 1055 370 1085 390 C1115 370 1115 340 1085 295Z" fill="#2D9CDB"/><text x="1085" y="460" text-anchor="middle" font-size="22" font-weight="700" fill="#195B45">进入水里</text><text x="1085" y="500" text-anchor="middle" font-size="17" fill="#20352D">每年仍有大量泄漏</text></g><text x="72" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#567066">来源：UNEP Annual Report 2024；UNEP Plastic Pollution。事实编号：F001、F002。两项数据口径不同，仅用于量级提示。</text></svg>
