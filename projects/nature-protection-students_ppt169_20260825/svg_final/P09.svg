<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">08 / 把目标变得可追踪</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">30%：一个需要共同完成的目标</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">目标不是口号，而是让恢复行动有方向、有时间点。</text><circle cx="390" cy="405" r="160" fill="none" stroke="#E9F5E7" stroke-width="52"/><path d="M390 245 A160 160 0 0 1 542 455" fill="none" stroke="#F47C5A" stroke-width="52"/><text x="390" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#195B45">30%</text><text x="390" y="468" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#567066">到 2030 年</text><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="680" y="275" width="430" height="92" rx="24" fill="#E9F5E7"/><text x="720" y="314" font-size="23" font-weight="700" fill="#195B45">恢复什么？</text><text x="720" y="348" font-size="18" fill="#20352D">退化的陆地、内陆水域、海洋与沿海生态系统</text><rect x="680" y="395" width="430" height="92" rx="24" fill="#DDF0FA"/><text x="720" y="434" font-size="23" font-weight="700" fill="#195B45">为什么重要？</text><text x="720" y="468" font-size="18" fill="#20352D">增强生物多样性、生态功能与连通性</text><rect x="680" y="515" width="430" height="72" rx="36" fill="#195B45"/><text x="895" y="560" text-anchor="middle" font-size="23" font-weight="700" fill="#FFF8EA">共同完成，比独自完美更重要</text></g><text x="72" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#567066">来源：UNEP Global Biodiversity Framework。事实编号：F006。</text></svg>
