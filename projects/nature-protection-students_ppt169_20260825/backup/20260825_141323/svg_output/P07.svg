<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">06 / 把数据变成习惯</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="44" font-weight="700" fill="#195B45">从“吃多少”到“点多少”</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#20352D">减废不靠完美，而靠下一次更准确的选择。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="90" y="270" width="1100" height="64" rx="32" fill="#E9F5E7"/><text x="125" y="311" font-size="24" font-weight="700" fill="#195B45">01</text><text x="205" y="311" font-size="24" fill="#20352D">先估量，再取餐</text><text x="805" y="311" font-size="24" fill="#567066">给自己留一点“刚刚好”</text><rect x="90" y="360" width="1100" height="64" rx="32" fill="#DDF0FA"/><text x="125" y="401" font-size="24" font-weight="700" fill="#195B45">02</text><text x="205" y="401" font-size="24" fill="#20352D">小份优先，不够再加</text><text x="805" y="401" font-size="24" fill="#567066">让选择更接近需要</text><rect x="90" y="450" width="1100" height="64" rx="32" fill="#FFF0B8"/><text x="125" y="491" font-size="24" font-weight="700" fill="#195B45">03</text><text x="205" y="491" font-size="24" fill="#20352D">剩余就打包，不随意多拿</text><text x="805" y="491" font-size="24" fill="#567066">让食物多一次机会</text><rect x="90" y="540" width="1100" height="64" rx="32" fill="#FADACF"/><text x="125" y="581" font-size="24" font-weight="700" fill="#195B45">04</text><text x="205" y="581" font-size="24" fill="#20352D">把建议反馈给食堂</text><text x="805" y="581" font-size="24" fill="#567066">让系统也更好用</text></g><text x="640" y="660" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#F47C5A">先选一个，不要一次选五个</text></svg>
