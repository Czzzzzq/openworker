<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">09 / 从今天开始</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">今天就能做的 5 个动作</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">低门槛、可记录、能重复——这就是可持续行动的起点。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><g><rect x="90" y="270" width="500" height="68" rx="34" fill="#E9F5E7"/><text x="125" y="314" font-size="25" font-weight="700" fill="#195B45">01</text><text x="205" y="314" font-size="23" fill="#20352D">自带水杯，少一次性包装</text></g><g><rect x="690" y="270" width="500" height="68" rx="34" fill="#DDF0FA"/><text x="725" y="314" font-size="25" font-weight="700" fill="#195B45">02</text><text x="805" y="314" font-size="23" fill="#20352D">按需取餐，减少剩余</text></g><g><rect x="90" y="390" width="500" height="68" rx="34" fill="#FFF0B8"/><text x="125" y="434" font-size="25" font-weight="700" fill="#195B45">03</text><text x="205" y="434" font-size="23" fill="#20352D">把物品修好，再考虑更换</text></g><g><rect x="690" y="390" width="500" height="68" rx="34" fill="#FADACF"/><text x="725" y="434" font-size="25" font-weight="700" fill="#195B45">04</text><text x="805" y="434" font-size="23" fill="#20352D">观察并保护校园生境</text></g><g><rect x="390" y="510" width="500" height="68" rx="34" fill="#195B45"/><text x="425" y="554" font-size="25" font-weight="700" fill="#FFF8EA">05</text><text x="505" y="554" font-size="23" fill="#FFF8EA">邀请一位同伴一起做</text></g></g><text x="640" y="646" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#F47C5A">先选一个，不要一次选五个</text></svg>
