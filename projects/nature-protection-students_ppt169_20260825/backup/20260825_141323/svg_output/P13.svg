<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#195B45"/><circle cx="1100" cy="150" r="150" fill="#2D9CDB" opacity="0.45"/><circle cx="180" cy="600" r="130" fill="#F47C5A" opacity="0.8"/><path d="M960 560 C1040 470 1130 470 1210 530" fill="none" stroke="#FFF8EA" stroke-width="8" stroke-linecap="round"/><text x="84" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFF0B8">最后，把行动带走</text><text x="84" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="60" font-weight="700" fill="#FFF8EA">从下一次选择开始</text><text x="88" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" fill="#E9F5E7">保护自然不是完美主义，</text><text x="88" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" fill="#E9F5E7">而是把一个好选择，变成更多人的默认选择。</text><rect x="88" y="500" width="470" height="72" rx="36" fill="#FFF8EA"/><text x="323" y="546" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#195B45">我今天选择：减量 / 循环 / 修复 / 倡议</text><text x="88" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#E9F5E7">谢谢｜愿下一次选择，离自然更近一点。</text></svg>
