<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">01 / 先把自然拉回身边</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">自然不是远方</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" fill="#20352D">校园里的每一次选择，都在连接一张更大的生态网络。</text><circle cx="640" cy="410" r="106" fill="#195B45"/><text x="640" y="402" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF8EA">校园</text><text x="640" y="438" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#FFF8EA">也是生态系统</text><g stroke="#195B45" stroke-width="5" fill="none"><path d="M560 350 L360 260"/><path d="M720 350 L920 260"/><path d="M560 480 L360 570"/><path d="M720 480 L920 570"/></g><g font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="middle"><circle cx="300" cy="230" r="64" fill="#DDF0FA"/><text x="300" y="225" font-size="25" font-weight="700" fill="#195B45">水</text><text x="300" y="253" font-size="17" fill="#20352D">河流与雨水</text><circle cx="980" cy="230" r="64" fill="#FFF0B8"/><text x="980" y="225" font-size="25" font-weight="700" fill="#195B45">空气</text><text x="980" y="253" font-size="17" fill="#20352D">出行与能源</text><circle cx="300" cy="590" r="64" fill="#E9F5E7"/><text x="300" y="585" font-size="25" font-weight="700" fill="#195B45">土壤</text><text x="300" y="613" font-size="17" fill="#20352D">绿地与食物</text><circle cx="980" cy="590" r="64" fill="#FADACF"/><text x="980" y="585" font-size="25" font-weight="700" fill="#195B45">生命</text><text x="980" y="613" font-size="17" fill="#20352D">植物与动物</text></g><text x="70" y="674" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#567066">先改变视角，再选择行动。</text></svg>
