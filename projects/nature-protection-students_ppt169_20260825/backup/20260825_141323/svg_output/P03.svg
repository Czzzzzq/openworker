<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">02 / 把环保变成行动地图</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">四类行动地图</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" fill="#20352D">不追求一次做到完美，先找到最容易开始的一格。</text><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="70" y="270" width="255" height="250" rx="28" fill="#E9F5E7"/><circle cx="130" cy="330" r="28" fill="#195B45"/><text x="130" y="341" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF8EA">1</text><text x="110" y="400" font-size="32" font-weight="700" fill="#195B45">减量</text><text x="110" y="445" font-size="20" fill="#20352D">少一次性</text><text x="110" y="480" font-size="18" fill="#567066">让资源少走一圈</text><rect x="355" y="270" width="255" height="250" rx="28" fill="#DDF0FA"/><circle cx="415" cy="330" r="28" fill="#2D9CDB"/><text x="415" y="341" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF8EA">2</text><text x="395" y="400" font-size="32" font-weight="700" fill="#195B45">循环</text><text x="395" y="445" font-size="20" fill="#20352D">多使用一次</text><text x="395" y="480" font-size="18" fill="#567066">让物品延长寿命</text><rect x="640" y="270" width="255" height="250" rx="28" fill="#FFF0B8"/><circle cx="700" cy="330" r="28" fill="#F0B429"/><text x="700" y="341" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF8EA">3</text><text x="680" y="400" font-size="32" font-weight="700" fill="#195B45">修复</text><text x="680" y="445" font-size="20" fill="#20352D">让空间更有生命</text><text x="680" y="480" font-size="18" fill="#567066">照顾校园生境</text><rect x="925" y="270" width="255" height="250" rx="28" fill="#FADACF"/><circle cx="985" cy="330" r="28" fill="#F47C5A"/><text x="985" y="341" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF8EA">4</text><text x="965" y="400" font-size="32" font-weight="700" fill="#195B45">倡议</text><text x="965" y="445" font-size="20" fill="#20352D">把好选择变规则</text><text x="965" y="480" font-size="18" fill="#567066">让更多人一起做</text></g><path d="M160 590 H1120" stroke="#195B45" stroke-width="4" stroke-dasharray="8 12"/><text x="640" y="636" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#195B45">从个人选择，到共同习惯</text></svg>
