<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">07 / 从单点问题到系统理解</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">气候与自然，是一张网</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">问题相互连接，所以行动也需要个人、组织与制度共同参与。</text><g stroke="#195B45" stroke-width="5" fill="none"><path d="M640 380 L360 270"/><path d="M640 380 L920 270"/><path d="M640 380 L360 520"/><path d="M640 380 L920 520"/><path d="M360 270 L920 270"/><path d="M360 520 L920 520"/></g><g font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="middle"><circle cx="640" cy="380" r="92" fill="#195B45"/><text x="640" y="374" font-size="28" font-weight="700" fill="#FFF8EA">自然</text><text x="640" y="410" font-size="18" fill="#FFF8EA">一张网</text><circle cx="300" cy="240" r="72" fill="#FADACF"/><text x="300" y="235" font-size="25" font-weight="700" fill="#195B45">气候</text><text x="300" y="267" font-size="17" fill="#20352D">影响与风险</text><circle cx="980" cy="240" r="72" fill="#DDF0FA"/><text x="980" y="235" font-size="25" font-weight="700" fill="#195B45">水</text><text x="980" y="267" font-size="17" fill="#20352D">循环与生态</text><circle cx="300" cy="550" r="72" fill="#FFF0B8"/><text x="300" y="545" font-size="25" font-weight="700" fill="#195B45">土壤</text><text x="300" y="577" font-size="17" fill="#20352D">食物与生境</text><circle cx="980" cy="550" r="72" fill="#E9F5E7"/><text x="980" y="545" font-size="25" font-weight="700" fill="#195B45">多样性</text><text x="980" y="577" font-size="17" fill="#20352D">生命共同体</text></g><text x="70" y="660" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#567066">依据 IPCC AR6 综合报告的主题框架。事实编号：F005。</text></svg>
