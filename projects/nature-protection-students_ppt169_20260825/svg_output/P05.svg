<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF8EA"/><text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47C5A">04 / 找到改变的环节</text><text x="70" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#195B45">一次性用品，如何变成选择？</text><text x="72" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#20352D">改变不只发生在“扔掉”那一刻，而是发生在选择之前。</text><g font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="middle"><circle cx="250" cy="390" r="105" fill="#DDF0FA"/><text x="250" y="380" font-size="28" font-weight="700" fill="#195B45">购买</text><text x="250" y="420" font-size="18" fill="#20352D">需要它吗？</text><circle cx="640" cy="390" r="105" fill="#E9F5E7"/><text x="640" y="380" font-size="28" font-weight="700" fill="#195B45">使用</text><text x="640" y="420" font-size="18" fill="#20352D">能重复吗？</text><circle cx="1030" cy="390" r="105" fill="#FADACF"/><text x="1030" y="380" font-size="28" font-weight="700" fill="#195B45">丢弃</text><text x="1030" y="420" font-size="18" fill="#20352D">能正确分类吗？</text></g><g stroke="#F47C5A" stroke-width="8" fill="none" stroke-linecap="round"><path d="M360 390 H520"/><path d="M750 390 H910"/><path d="M1030 510 C860 620 420 620 250 510"/></g><g fill="#F47C5A"><path d="M505 375 l22 15 -22 15z"/><path d="M895 375 l22 15 -22 15z"/><path d="M245 495 l-4 28 24-14z"/></g><rect x="465" y="570" width="350" height="66" rx="33" fill="#195B45"/><text x="640" y="612" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFF8EA">把“默认”改成“选择”</text></svg>
